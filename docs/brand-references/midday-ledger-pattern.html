<!-- Midday Tabular Ledger & Hairline Border Pattern
     Source: https://midday.ai (extracted 2026-11-15)
     Assets observed:
       - Favicon: https://midday.ai/favicon.ico
       - Video poster: https://midday.ai/cdn-cgi/image/width=1200,quality=50/https://cdn.midday.ai/video-poster-v2.jpg
       - Light dashboard SVG: https://midday.ai/images/dashboard-light.svg
       - Dark dashboard SVG: https://midday.ai/images/dashboard-dark.svg
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Midday Ledger Reference Pattern</title>
  <style>
    .cala-ledger-wrap {
      background: #f8f9fc;
      color: #0f172a;
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
    }
    .cala-ledger-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    .cala-ledger-table th,
    .cala-ledger-table td {
      padding: 10px 14px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      font-size: 13px;
    }
    .cala-ledger-table th {
      font-weight: 500;
      color: #64748b;
      background: #f8f9fc;
    }
    .cala-num {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="cala-ledger-wrap">
    <table class="cala-ledger-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th class="cala-num">Amount</th>
          <th>Category</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="cala-num" style="text-align:left;">Sep 10</td>
          <td>Office Supplies Co.</td>
          <td class="cala-num">-45,20 kr</td>
          <td>Office Supplies</td>
        </tr>
        <tr>
          <td class="cala-num" style="text-align:left;">Sep 09</td>
          <td>Freelance Payment</td>
          <td class="cala-num">+1 200,00 kr</td>
          <td>Income</td>
        </tr>
        <tr>
          <td class="cala-num" style="text-align:left;">Sep 08</td>
          <td>AWS</td>
          <td class="cala-num">-1 820,50 kr</td>
          <td>Infrastructure</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
