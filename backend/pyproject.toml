[project]
name = "demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
    "cala-canonizador",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
cala-canonizador = { path = "../canonizador", editable = true }

[project.optional-dependencies]
audio = ["faster-whisper>=1.1", "av>=14,<17"]  # av 17+ quitó metadata_errors, que usa faster-whisper

[tool.pytest.ini_options]
pythonpath = ["."]
