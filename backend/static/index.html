<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Deck Verifier · powered by Cala</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--surface:#fff;--text:#18212b;--muted:#65717e;--line:#e1e5e9;--accent:#145d50;--soft:#e9f2ef;--shadow:0 8px 28px #18212b0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(100% - 36px,980px);margin:auto}.top{padding:32px 0 25px;border-bottom:1px solid var(--line)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:clamp(24px,4vw,32px);letter-spacing:-.04em;margin:0}.brand{color:var(--accent)}.sub{color:var(--muted);margin:5px 0 0}.theme{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 12px}.upload{margin:28px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}.drop{border:1.5px dashed #b9c4c8;border-radius:12px;text-align:center;padding:34px 18px;transition:.15s}.drop.over{border-color:var(--accent);background:var(--soft)}.icon{font-size:25px;color:var(--accent)}.drop strong{display:block;font-size:17px;margin:6px}.muted{color:var(--muted)}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:17px}.primary,.secondary{border:0;border-radius:9px;padding:10px 16px;font-weight:650}.primary{background:var(--accent);color:white}.secondary{background:var(--soft);color:var(--accent)}button:disabled{opacity:.55;cursor:wait}.status{margin-top:18px;display:none;border-top:1px solid var(--line);padding-top:20px}.steps{display:flex;gap:8px;flex-wrap:wrap}.step{padding:7px 11px;border-radius:20px;background:var(--bg);color:var(--muted);font-size:13px}.step.active{background:var(--soft);color:var(--accent);font-weight:650}.step.done{color:#28734a}.bar{height:4px;background:var(--line);border-radius:9px;margin-top:15px;overflow:hidden}.bar i{display:block;width:30%;height:100%;background:var(--accent);animation:load 1.3s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(210%)}}.error{color:#b42318;margin-top:12px}.report{display:none;margin:32px 0 64px}.summary{display:grid;grid-template-columns:170px 1fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}.score{text-align:center;border-right:1px solid var(--line);padding-right:22px}.score b{font-size:55px;letter-spacing:-.06em;line-height:1}.score small{display:block;color:var(--muted);margin-top:7px}.meta h2{margin:0;font-size:21px}.meta p{color:var(--muted);margin:3px 0}.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.count{font-size:12px;background:var(--bg);padding:5px 9px;border-radius:20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}.toolbar h2{font-size:19px;margin:0}.toolbar select{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:8px}.claim{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:20px;margin:12px 0;box-shadow:var(--shadow)}.claimhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.quote{font-weight:650;font-size:16px;margin:0}.page{color:var(--muted);font-size:12px;margin-top:4px}.badge{white-space:nowrap;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}.confirmed{background:#e7f5eb;color:#21643a}.partially_confirmed{background:#fff3d6;color:#865b00}.contradicted,.errorbadge{background:#fde9e7;color:#a22c24}.no_data,.not_checked{background:#edf0f2;color:#59636d}.explanation{margin:14px 0 0}.evidence{border-left:3px solid #cbd7d2;padding:8px 12px;background:var(--bg);color:var(--muted);margin-top:12px}.sources{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.sources a{font-size:13px;color:var(--accent);overflow-wrap:anywhere}.empty{color:var(--muted);padding:20px;text-align:center}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111719;--surface:#192124;--text:#e8eeec;--muted:#a2afad;--line:#303b3e;--accent:#83c6ae;--soft:#233a34;--shadow:0 8px 28px #0002}.drop{border-color:#50605f}.confirmed{background:#1e3929;color:#a6deb4}.partially_confirmed{background:#40351f;color:#f0d28b}.contradicted,.errorbadge{background:#432826;color:#ffb0a8}.no_data,.not_checked{background:#2c3639;color:#c3cdca}}body.light{color-scheme:light}body.dark{color-scheme:dark}
@media(max-width:600px){.wrap{width:min(100% - 24px,980px)}.top{padding:22px 0}.upload{padding:16px;margin:18px 0}.drop{padding:26px 12px}.summary{grid-template-columns:1fr;padding:18px;gap:15px}.score{border:0;border-bottom:1px solid var(--line);padding:0 0 15px}.score b{font-size:48px}.claim{padding:16px}.claimhead{display:block}.badge{display:inline-block;margin-top:10px}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="top"><div class="wrap toprow"><div><h1>Deck Verifier <span class="brand">· powered by Cala</span></h1><p class="sub">Check the public claims in a pitch deck against trusted company data.</p></div><button class="theme" id="theme" type="button" aria-label="Toggle color theme">◐ Theme</button></div></header>
<main class="wrap"><section class="upload" aria-label="Upload pitch deck"><div class="drop" id="drop"><div class="icon" aria-hidden="true">↑</div><strong>Drop your pitch deck here</strong><span class="muted">PDF only · up to 20 MB</span><div class="actions"><label class="primary" for="file">Choose PDF</label><input class="sr" id="file" type="file" accept="application/pdf,.pdf"><button class="secondary" id="sample" type="button">Try sample deck</button></div></div><div class="status" id="status" aria-live="polite"><div class="steps"><span class="step" id="s1">1 · Extracting claims</span><span class="step" id="s2">2 · Checking with Cala</span><span class="step" id="s3">3 · Judging evidence</span></div><p class="muted" id="statusText">Preparing your deck…</p><p class="muted" id="elapsed">Elapsed: 0.0s</p><div class="bar"><i></i></div><div class="error" id="error" role="alert"></div></div></section><section class="report" id="report" aria-live="polite"></section></main>
<script>
const $=s=>document.querySelector(s), labels={confirmed:'✔ Confirmed',partially_confirmed:'◐ Partially confirmed',contradicted:'✖ Contradicted',no_data:'? No data',not_checked:'— Not checked',error:'! Error'};let current=null,pollTimer;
$('#theme').onclick=()=>{const dark=document.body.classList.toggle('dark');document.body.classList.toggle('light',!dark)};
$('#file').onchange=e=>{if(e.target.files[0]) submitFile(e.target.files[0])};$('#sample').onclick=()=>start('/api/verify-sample');
const drop=$('#drop');['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)submitFile(f)});
async function submitFile(f){if(!f.name.toLowerCase().endsWith('.pdf'))return showError('Please choose a PDF file.');if(f.size>20*1024*1024)return showError('This file is larger than 20 MB.');const data=new FormData();data.append('file',f);await start('/api/verify',data)}
function showError(t){$('#status').style.display='block';$('#error').textContent=t}
async function start(url,body){clearTimeout(pollTimer);$('#report').style.display='none';$('#report').innerHTML='';$('#status').style.display='block';$('#error').textContent='';$('#elapsed').textContent='Elapsed: 0.0s';$('#statusText').textContent='Uploading deck…';document.querySelectorAll('.step').forEach(x=>x.className='step');try{const r=await fetch(url,{method:'POST',body});const d=await r.json();if(!r.ok)throw Error(d.detail||'Could not start verification.');current=d.job_id;poll()}catch(e){showError(e.message)}}
async function poll(){try{const r=await fetch('/api/jobs/'+current),j=await r.json();if(!r.ok)throw Error(j.detail||'Could not read job status.');$('#elapsed').textContent=`Elapsed: ${(j.elapsed_s||0).toFixed(1)}s`;const order=['extracting','checking','judging'];if(j.status==='queued'){$('#statusText').textContent='Waiting in queue…'}else if(order.includes(j.status)){const n=order.indexOf(j.status);for(let i=0;i<n;i++)$('#s'+(i+1)).classList.add('done');$('#s'+(n+1)).classList.add('active');if(j.status==='extracting')$('#statusText').textContent='Extracting claims from the deck…';if(j.status==='checking')$('#statusText').textContent=`Checking with Cala ${j.progress?.done??0}/${j.progress?.total??0}`;if(j.status==='judging')$('#statusText').textContent=`Judging evidence ${j.progress?.done??0}/${j.progress?.total??0}`}if(j.status==='done'){['s1','s2','s3'].forEach(x=>$('#'+x).classList.add('done'));$('#statusText').textContent='Verification complete.';render(j.report);return}if(j.status==='error')throw Error(j.error||'Verification failed.')}catch(e){showError(e.message);return}pollTimer=setTimeout(poll,1500)}
function render(r){const counts=r.summary||{},summary=Object.entries(counts).map(([k,v])=>`<span class="count">${labels[k]||k}: ${v}</span>`).join('');$('#report').style.display='block';$('#report').innerHTML=`<div class="summary"><div class="score"><b>${r.trust_score??'—'}</b><small>Trust score / 100</small></div><div class="meta"><h2>${esc(r.startup_name||'Verified deck')}</h2><p>${esc(r.provider||'')} · ${esc(r.model||'')}</p><p>Total time: ${r.timings?.total_s??'—'}s</p><div class="counts">${summary}</div></div></div><div class="toolbar"><h2>Claims (${r.claims?.length||0})</h2><label>Filter <select id="filter"><option value="all">All verdicts</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label></div><div id="claims"></div>`;const list=$('#claims');function draw(){const f=$('#filter').value;const rows=(r.claims||[]).filter(c=>f==='all'||c.verdict===f);list.innerHTML=rows.length?rows.map(c=>`<article class="claim"><div class="claimhead"><div><p class="quote">“${esc(c.quote||'Claim')}</p><div class="page">Page ${esc(c.page??'—')} · ${esc(c.category||'')}</div></div><span class="badge ${c.verdict||'no_data'}">${labels[c.verdict]||labels.no_data}</span></div><p class="explanation">${esc(c.explanation||'')}</p>${c.evidence?`<div class="evidence">${esc(c.evidence)}</div>`:''}${c.sources?.length?`<div class="sources">${c.sources.map((s,i)=>`<a href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.name||'Source '+(i+1))} ↗</a>`).join('')}</div>`:''}</article>`).join(''):'<div class="empty">No claims match this filter.</div>'}$('#filter').onchange=draw;draw();$('#report').scrollIntoView({behavior:'smooth',block:'start'})}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeUrl(x){try{const u=new URL(x);return ['https:','http:'].includes(u.protocol)?esc(u.href):'#'}catch{return '#'}}
</script></body></html>
